<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Scontrini</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#cfd7de;--acc:#0b6b63;--acc-ink:#fff;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f161c;--card:#18222b;--ink:#e8eef3;--mute:#93a3b1;--line:#2b3a46;--acc:#3fb8aa;--acc-ink:#04201d;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.5rem;margin:8px 0 0;letter-spacing:-.01em}
p{margin:0;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px 16px;background:var(--acc);color:var(--acc-ink);width:100%;text-align:center;cursor:pointer;display:block}
button.sec,.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
input[type=date],input[type=time],input[type=text]{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
img{max-width:100%;max-height:220px;object-fit:contain;border-radius:10px;justify-self:center;border:1px solid var(--line)}
#msg{min-height:1.4em;font-weight:600}
#msg.err{color:var(--err)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Scontrini</h1>


  <section class="card" id="setup" hidden>
    <p>Collega l'app al Drive su cui salvare gli scontrini. Lo fai solo la prima volta.</p>
    <label>Indirizzo dello script <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label>Parola segreta <input type="text" id="cfgKey" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <button id="btnCollega">Collega</button>
  </section>

  <section class="card" id="app" hidden>
    <label class="btn" for="foto" tabindex="0" id="btnFoto">Scatta o scegli una foto</label>
    <input type="file" id="foto" accept="image/*" capture="environment">
    <img id="prev" alt="Anteprima scontrino" hidden>
    <div id="campi" hidden>
      <div style="display:grid;gap:14px">
        <div class="row">
          <label>Data <input type="date" id="data"></label>
          <label>Ora <input type="time" id="ora"></label>
        </div>
        <label>Importo (€) <input type="text" id="importo" inputmode="decimal" placeholder="0,00"></label>
        <button id="btnSalva">Salva in Drive e nel foglio</button>
        <button class="sec" id="btnNuovo">Annulla</button>
      </div>
    </div>
    <p id="msg" role="status"></p>
    <a id="linkFoglio" href="#" target="_blank" rel="noopener" hidden>Apri il foglio</a>
    <p id="account"></p>
    <button class="sec" id="btnCambia">Cambia Drive</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let blob = null;
function say(t, err){ const m=$("msg"); m.textContent=t||""; m.className=err?"err":""; }

// ---------- Collegamento al Drive (si fa una volta sola per dispositivo) ----------
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
let SCRIPT_URL = store.get("scriptUrl") || "", CHIAVE = store.get("chiave") || "";

async function chiama(payload){
  const r = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({chiave: CHIAVE}, payload))
  });
  const t = await r.text();
  let j;
  try { j = JSON.parse(t); }
  catch(e){ throw new Error("Risposta non valida dallo script: controlla che l'accesso sia impostato su «Chiunque»."); }
  if(!j.ok) throw new Error(j.error || "Operazione non riuscita");
  return j;
}
function mostra(){
  const ok = !!(SCRIPT_URL && CHIAVE);
  $("setup").hidden = ok; $("app").hidden = !ok;
  const acc = store.get("account");
  $("account").textContent = acc ? "Drive collegato: " + acc : "";
}
$("btnCollega").onclick = async () => {
  const u = $("cfgUrl").value.trim(), k = $("cfgKey").value.trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u) || !k){
    alert("Controlla i dati: l'indirizzo deve terminare con /exec e la parola segreta non può essere vuota."); return;
  }
  SCRIPT_URL = u; CHIAVE = k;
  $("btnCollega").disabled = true; $("btnCollega").textContent = "Verifico…";
  try{
    const j = await chiama({azione:"verifica"});
    store.set("scriptUrl", u); store.set("chiave", k); store.set("account", j.account || "");
    mostra();
  }catch(err){
    SCRIPT_URL = ""; CHIAVE = "";
    alert("Collegamento non riuscito: " + err.message);
  }finally{
    $("btnCollega").disabled = false; $("btnCollega").textContent = "Collega";
  }
};
$("btnCambia").onclick = () => {
  if(!confirm("Scollegare questo Drive per collegarne un altro?")) return;
  store.del("scriptUrl"); store.del("chiave"); store.del("account");
  SCRIPT_URL = ""; CHIAVE = ""; say(""); mostra();
};
mostra();

// ---------- Foto e lettura ----------
function resize(file, max){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("Immagine non valida")),"image/jpeg",0.85);
    };
    img.onerror = () => rej(new Error("Impossibile leggere l'immagine"));
    img.src = url;
  });
}
function parse(text){
  const out = {data:"", ora:"", importo:""};
  let m = text.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){ let y=m[3]; if(y.length===2) y="20"+y; out.data = `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  m = text.match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)\b(?!\d)/);
  if(m) out.ora = m[1].padStart(2,"0")+":"+m[2];
  const num = s => parseFloat(s.replace(/\./g,"").replace(",","."));
  const rx = /(\d{1,6}(?:[.,]\d{3})*[.,]\d{2})\b/g;
  let best = null;
  for(const line of text.split("\n")){
    if(/total|import|complessiv|da pagare|euro|eur\b/i.test(line) && !/subtotal|iva|resto/i.test(line)){
      const all = line.match(rx);
      if(all){ const v = num(all[all.length-1]); if(!isNaN(v)) best = v; }
    }
  }
  if(best===null){
    const all = text.match(rx)||[]; const vals = all.map(num).filter(v=>!isNaN(v));
    if(vals.length) best = Math.max(...vals);
  }
  if(best!==null) out.importo = best.toFixed(2).replace(".",",");
  return out;
}
// Pretrattamento: scala di grigi, contrasto e (opzionale) bianco/nero locale
async function preprocess(b, binarize){
  const img = await createImageBitmap(b);
  const w = img.width, h = img.height;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d", {willReadFrequently:true});
  ctx.drawImage(img, 0, 0);
  const id = ctx.getImageData(0, 0, w, h), d = id.data, n = w*h;
  const gray = new Uint8Array(n), hist = new Uint32Array(256);
  for(let i=0;i<n;i++){ const v = (0.299*d[4*i] + 0.587*d[4*i+1] + 0.114*d[4*i+2])|0; gray[i]=v; hist[v]++; }
  let acc=0, lo=0, hi=255;
  for(let v=0;v<256;v++){ acc+=hist[v]; if(acc>=n*0.02){ lo=v; break; } }
  acc=0;
  for(let v=255;v>=0;v--){ acc+=hist[v]; if(acc>=n*0.02){ hi=v; break; } }
  const span = Math.max(1, hi-lo);
  for(let i=0;i<n;i++){ gray[i] = Math.max(0, Math.min(255, ((gray[i]-lo)*255/span)|0)); }
  let out = gray;
  if(binarize){
    const W = w+1, integ = new Uint32Array(W*(h+1));
    for(let y=1;y<=h;y++){
      let row = 0;
      for(let x=1;x<=w;x++){ row += gray[(y-1)*w+(x-1)]; integ[y*W+x] = integ[(y-1)*W+x] + row; }
    }
    const r = Math.max(8, Math.round(w/40));
    out = new Uint8Array(n);
    for(let y=0;y<h;y++){
      const y0=Math.max(0,y-r), y1=Math.min(h,y+r+1);
      for(let x=0;x<w;x++){
        const x0=Math.max(0,x-r), x1=Math.min(w,x+r+1);
        const sum = integ[y1*W+x1]-integ[y0*W+x1]-integ[y1*W+x0]+integ[y0*W+x0];
        const mean = sum/((x1-x0)*(y1-y0));
        out[y*w+x] = gray[y*w+x] < mean-12 ? 0 : 255;
      }
    }
  }
  for(let i=0;i<n;i++){ d[4*i]=d[4*i+1]=d[4*i+2]=out[i]; d[4*i+3]=255; }
  ctx.putImageData(id, 0, 0);
  return c;
}
async function runOcr(canvas, psm){
  const worker = await Tesseract.createWorker("ita");
  try{
    await worker.setParameters({tessedit_pageseg_mode:String(psm), user_defined_dpi:"300"});
    const r = await worker.recognize(canvas);
    return r.data.text;
  } finally { await worker.terminate(); }
}

$("foto").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  $("campi").hidden = true; say("Preparo la foto…");
  try{
    blob = await resize(f, 1800);
    $("prev").src = URL.createObjectURL(blob); $("prev").hidden = false;
    say("Leggo lo scontrino…");
    const d = parse(await runOcr(await preprocess(blob, true), 6));
    if(!d.data || !d.ora || !d.importo){
      say("Secondo tentativo di lettura…");
      const d2 = parse(await runOcr(await preprocess(blob, false), 4));
      d.data = d.data || d2.data; d.ora = d.ora || d2.ora; d.importo = d.importo || d2.importo;
    }
    $("data").value = d.data; $("ora").value = d.ora; $("importo").value = d.importo;
    $("campi").hidden = false;
    say(d.data && d.ora && d.importo ? "Controlla i dati e salva." : "Alcuni dati non sono stati letti: completali a mano.");
  }catch(err){ say(err.message, true); }
};
$("btnNuovo").onclick = () => { $("campi").hidden=true; $("prev").hidden=true; $("foto").value=""; blob=null; say(""); };

// ---------- Salvataggio ----------
function toBase64(b){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(",")[1]);
    fr.onerror = () => rej(new Error("Impossibile leggere la foto"));
    fr.readAsDataURL(b);
  });
}
$("btnSalva").onclick = async () => {
  const d=$("data").value, o=$("ora").value, i=$("importo").value.trim().replace(/\./g,",");
  if(!d||!o||!/^\d+(,\d{1,2})?$/.test(i)){ say("Compila data, ora e un importo valido (es. 12,50).", true); return; }
  if(!blob){ say("Prima scatta o scegli una foto.", true); return; }
  $("btnSalva").disabled = true; say("Salvo…");
  try{
    const [y,mo,da] = d.split("-");
    const j = await chiama({azione:"salva", dataIso:d, data:`${da}/${mo}/${y}`, ora:o,
                            importo:parseFloat(i.replace(",",".")), foto: await toBase64(blob)});
    say(`Salvato in «Settimana ${j.settimana}» come ${j.nome}`);
    $("linkFoglio").href = j.sheetUrl; $("linkFoglio").hidden = false;
    $("campi").hidden=true; $("prev").hidden=true; $("foto").value=""; blob=null;
  }catch(err){ say(err.message, true); }
  finally{ $("btnSalva").disabled = false; }
};
</script>
</body>
</html>
