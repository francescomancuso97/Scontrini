<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Scontrini</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#cfd7de;--acc:#0b6b63;--acc-ink:#fff;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f161c;--card:#18222b;--ink:#e8eef3;--mute:#93a3b1;--line:#2b3a46;--acc:#3fb8aa;--acc-ink:#04201d;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.5rem;margin:8px 0 0;letter-spacing:-.01em}
p{margin:0;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px 16px;background:var(--acc);color:var(--acc-ink);width:100%;text-align:center;cursor:pointer;display:block}
button.sec,.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
input[type=date],input[type=time],input[type=text]{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
img{max-width:100%;max-height:220px;object-fit:contain;border-radius:10px;justify-self:center;border:1px solid var(--line)}
#msg{min-height:1.4em;font-weight:600}
#msg.err{color:var(--err)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Scontrini</h1>

  <section class="card" id="login">
    <p>Accedi con Google per salvare le foto in Drive e le righe nel foglio.</p>
    <button id="btnLogin">Accedi con Google</button>
  </section>

  <section class="card" id="app" hidden>
    <label class="btn" for="foto" tabindex="0" id="btnFoto">Scatta o scegli una foto</label>
    <input type="file" id="foto" accept="image/*" capture="environment">
    <img id="prev" alt="Anteprima scontrino" hidden>
    <div id="campi" hidden>
      <div style="display:grid;gap:14px">
        <div class="row">
          <label>Data <input type="date" id="data"></label>
          <label>Ora <input type="time" id="ora"></label>
        </div>
        <label>Importo (€) <input type="text" id="importo" inputmode="decimal" placeholder="0,00"></label>
        <button id="btnSalva">Salva in Drive e nel foglio</button>
        <button class="sec" id="btnNuovo">Annulla</button>
      </div>
    </div>
    <p id="msg" role="status"></p>
    <a id="linkFoglio" href="#" target="_blank" rel="noopener" hidden>Apri il foglio</a>
  </section>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
// === DA COMPILARE: il tuo ID client OAuth (tipo "Applicazione web") ===
const CLIENT_ID = "INCOLLA_QUI_IL_TUO_CLIENT_ID.apps.googleusercontent.com";
const SCOPE = "https://www.googleapis.com/auth/drive.file";
const $ = id => document.getElementById(id);
let token = null, tokenExp = 0, tokenClient = null, blob = null;

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
function say(t, err){ const m=$("msg"); m.textContent=t||""; m.className=err?"err":""; }

// ---------- Accesso Google ----------
function initAuth(){
  tokenClient = google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID, scope:SCOPE, callback:()=>{}});
}
function getToken(prompt){
  return new Promise((resolve,reject)=>{
    if(token && Date.now() < tokenExp) return resolve(token);
    if(!tokenClient) return reject(new Error("Google non è ancora caricato, riprova."));
    tokenClient.callback = r => {
      if(r.error) return reject(new Error(r.error));
      token = r.access_token; tokenExp = Date.now() + (r.expires_in-60)*1000;
      store.set("hadLogin","1"); resolve(token);
    };
    tokenClient.requestAccessToken({prompt: prompt||""});
  });
}
$("btnLogin").onclick = async () => {
  try { await getToken("consent"); $("login").hidden=true; $("app").hidden=false; }
  catch(e){ alert("Accesso non riuscito: "+e.message); }
};
window.addEventListener("load", () => {
  const t = setInterval(()=>{ if(window.google && google.accounts){ clearInterval(t); initAuth(); } }, 200);
});

// ---------- Chiamate Google ----------
async function g(url, opts){
  const tk = await getToken();
  const r = await fetch(url, Object.assign({}, opts, {headers:Object.assign({Authorization:"Bearer "+tk}, (opts&&opts.headers)||{})}));
  if(!r.ok) throw new Error("Errore Google ("+r.status+"): "+(await r.text()).slice(0,200));
  return r.json();
}
async function ensureFolderAndSheet(){
  let folder = store.get("folderId"), sheet = store.get("sheetId");
  if(!folder){
    const f = await g("https://www.googleapis.com/drive/v3/files",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:"Scontrini",mimeType:"application/vnd.google-apps.folder"})});
    folder = f.id; store.set("folderId",folder);
  }
  if(!sheet){
    const s = await g("https://www.googleapis.com/drive/v3/files",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:"Scontrini",mimeType:"application/vnd.google-apps.spreadsheet",parents:[folder]})});
    sheet = s.id; store.set("sheetId",sheet);
    await g(`https://sheets.googleapis.com/v4/spreadsheets/${sheet}/values/A1:C1:append?valueInputOption=USER_ENTERED`,
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({values:[["Data","Ora","Importo"]]})});
  }
  return {folder, sheet};
}
async function uploadPhoto(name, folder){
  const meta = {name, parents:[folder], mimeType:"image/jpeg"};
  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify(meta)],{type:"application/json"}));
  fd.append("file", blob);
  return g("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {method:"POST", body:fd});
}

// ---------- Foto e lettura ----------
function resize(file, max){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("Immagine non valida")),"image/jpeg",0.85);
    };
    img.onerror = () => rej(new Error("Impossibile leggere l'immagine"));
    img.src = url;
  });
}
function parse(text){
  const out = {data:"", ora:"", importo:""};
  let m = text.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){ let y=m[3]; if(y.length===2) y="20"+y; out.data = `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  m = text.match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)\b(?!\d)/);
  if(m) out.ora = m[1].padStart(2,"0")+":"+m[2];
  const num = s => parseFloat(s.replace(/\./g,"").replace(",","."));
  const rx = /(\d{1,6}(?:[.,]\d{3})*[.,]\d{2})\b/g;
  let best = null;
  for(const line of text.split("\n")){
    if(/total|import|complessiv|da pagare|euro|eur\b/i.test(line) && !/subtotal|iva|resto/i.test(line)){
      const all = line.match(rx);
      if(all){ const v = num(all[all.length-1]); if(!isNaN(v)) best = v; }
    }
  }
  if(best===null){
    const all = text.match(rx)||[]; const vals = all.map(num).filter(v=>!isNaN(v));
    if(vals.length) best = Math.max(...vals);
  }
  if(best!==null) out.importo = best.toFixed(2).replace(".",",");
  return out;
}
$("foto").onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  $("campi").hidden = true; say("Preparo la foto…");
  try{
    blob = await resize(f, 1800);
    $("prev").src = URL.createObjectURL(blob); $("prev").hidden = false;
    say("Leggo lo scontrino…");
    const r = await Tesseract.recognize(blob, "ita");
    const d = parse(r.data.text);
    $("data").value = d.data; $("ora").value = d.ora; $("importo").value = d.importo;
    $("campi").hidden = false;
    say(d.data && d.ora && d.importo ? "Controlla i dati e salva." : "Alcuni dati non sono stati letti: completali a mano.");
  }catch(err){ say(err.message, true); }
};
$("btnNuovo").onclick = () => { $("campi").hidden=true; $("prev").hidden=true; $("foto").value=""; blob=null; say(""); };

// ---------- Salvataggio ----------
$("btnSalva").onclick = async () => {
  const d=$("data").value, o=$("ora").value, i=$("importo").value.trim().replace(/\./g,",");
  if(!d||!o||!/^\d+(,\d{1,2})?$/.test(i)){ say("Compila data, ora e un importo valido (es. 12,50).", true); return; }
  $("btnSalva").disabled = true; say("Salvo…");
  try{
    const {folder, sheet} = await ensureFolderAndSheet();
    const name = `${d}_${o.replace(":","-")}.jpg`;
    await uploadPhoto(name, folder);
    const [y,mo,da] = d.split("-");
    await g(`https://sheets.googleapis.com/v4/spreadsheets/${sheet}/values/A:C:append?valueInputOption=USER_ENTERED`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({values:[[`${da}/${mo}/${y}`, o, parseFloat(i.replace(",","."))]]})});
    say("Salvato: "+name);
    $("linkFoglio").href = "https://docs.google.com/spreadsheets/d/"+sheet; $("linkFoglio").hidden = false;
    $("campi").hidden=true; $("prev").hidden=true; $("foto").value=""; blob=null;
  }catch(err){ say(err.message, true); }
  finally{ $("btnSalva").disabled = false; }
};
</script>
</body>
</html>
